name: Build PlayniteAchievements (.pext)

# Builds the add-on on a GitHub-hosted Windows machine and attaches the installable .pext to the
# run as an artifact. Compiler errors and unit-test results are also written out as annotations.
# Runs on pushes to ci/** and feature/** branches only.

on:
  push:
    branches:
      - "ci/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore source/PlayniteAchievements.sln

      - name: Build the add-on (Release)
        id: build
        shell: pwsh
        run: |
          msbuild source/PlayniteAchievements.csproj /p:Configuration=Release /m /v:minimal /nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show compiler problems as an annotation
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $errs = Select-String -Path build.log -Pattern ': error ' | Select-Object -First 30 | ForEach-Object { $_.Line.Trim() }
          if (-not $errs) { $errs = Get-Content build.log -Tail 25 }
          $msg = ($errs -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          Write-Host "::error title=msbuild failed::$msg"

      - name: Run the unit tests
        id: tests
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet test tests/PlayniteAchievements.Tests/PlayniteAchievements.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarise the unit tests as annotations
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) {
            $tail = (Get-Content test.log -Tail 25 -ErrorAction SilentlyContinue) -join "`n"
            $msg = $tail -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::warning title=unit tests produced no results::$msg"
            exit 0
          }
          [xml]$x = Get-Content $trx.FullName
          $c = $x.TestRun.ResultSummary.Counters
          Write-Host "::notice title=unit tests::total=$($c.total) passed=$($c.passed) failed=$($c.failed)"
          $results = @($x.TestRun.Results.UnitTestResult)
          $mine = 'ThisBuild_RecordsThePrimaryDisplay','DisplayRecordings_TurnEveryWantedVariantIntoOneCleanClip','NoVariantWanted_StaysNoClipForEitherTarget','GameWindowRecordings_KeepTheResolvedVariants','DisplayRecordings_NeverServeScreenshotsFromTheRecordingBuffer','ThisBuild_KeepsScreenshotsOffTheRecordingBuffer'
          $mineResults = @($results | Where-Object { $mine -contains $_.testName })
          $okCount = @($mineResults | Where-Object { $_.outcome -eq 'Passed' }).Count
          Write-Host "::notice title=display-recording tests::$okCount of $($mine.Count) passed ($($mineResults.Count) found)"
          $failed = @($results | Where-Object { $_.outcome -eq 'Failed' } | Select-Object -First 25 | ForEach-Object { $_.testName })
          if ($failed.Count -gt 0) {
            $msg = ($failed -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::warning title=failing unit tests (first 25)::$msg"
          }

      - name: Package the .pext
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $out = "source/bin/Release"
          $ver = ((Select-String -Path source/extension.yaml -Pattern '^Version:\s*(.+)$').Matches[0].Groups[1].Value).Trim()
          $id  = ((Select-String -Path source/extension.yaml -Pattern '^Id:\s*(.+)$').Matches[0].Groups[1].Value).Trim()
          $zip = "$id`_$ver-display-recording.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force
          Rename-Item -Path $zip -NewName ($zip -replace '\.zip$','.pext')
          Get-ChildItem *.pext | Select-Object Name, Length

      - name: Upload the add-on
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PlayniteAchievements-pext
          path: "*.pext"
          if-no-files-found: error
          retention-days: 30
