name: Build achievements-recorder.exe

# Builds the native recorder helper on a GitHub-hosted Windows machine so nothing
# has to be installed locally. The finished .exe is attached to the run as an
# artifact ("achievements-recorder-exe"): open the run on the Actions tab, scroll to
# "Artifacts", download the zip and copy the .exe into utils\native\.
#
# It runs on pushes to feature/** and ci/** branches only. Compiler errors and failed
# unit tests are also written out as annotations on the run so they are easy to read.

on:
  push:
    branches:
      - "feature/**"
      - "ci/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Make sure a recent Rust toolchain is used
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Build the recorder (locked dependencies)
        id: build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked --manifest-path native/achievement-recorder/Cargo.toml --message-format=short 2>&1 | tee build.log

      - name: Show compiler problems as an annotation
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          body=$( (grep -E 'error|warning: unused' build.log | head -40; echo '--- end of log ---'; tail -n 15 build.log) | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=cargo build failed::${body}"

      - name: Run the recorder's unit tests
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --release --locked --manifest-path native/achievement-recorder/Cargo.toml 2>&1 | tee test.log

      - name: Show unit test problems as an annotation
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          body=$( (grep -E 'panicked|FAILED|failed|error' test.log | head -40; echo '--- end of log ---'; tail -n 15 test.log) | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=recorder unit tests failed::${body}"

      - name: Show what was built
        shell: pwsh
        run: |
          $exe = "native/achievement-recorder/target/release/achievements-recorder.exe"
          Get-Item $exe | Select-Object Name, Length, LastWriteTime
          Get-FileHash $exe -Algorithm SHA256 | Select-Object Hash

      - name: Upload the recorder
        uses: actions/upload-artifact@v4
        with:
          name: achievements-recorder-exe
          path: native/achievement-recorder/target/release/achievements-recorder.exe
          if-no-files-found: error
          retention-days: 30

      # The exe above is uploaded either way. This last step only turns a failed
      # unit-test run into a red run so it cannot go unnoticed.
      - name: Report unit test result
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "The recorder unit tests failed (the exe was still built and uploaded)."
          exit 1
